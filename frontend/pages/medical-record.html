<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dossier Médical - GeniDoc</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-blue: #0052cc;
        --primary-blue-dark: #003a99;
        --primary-blue-light: #e6f0ff;
        --bg-secondary: #f9fafc;
        --text-dark: #111827;
        --text-muted: #6b7280;
        --border-light: #e5e7eb;
        --font-main: "Plus Jakarta Sans", sans-serif;
        --success: #10b981;
        --warning: #f59e0b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-main);
        background: linear-gradient(
          135deg,
          #ffffff 0%,
          var(--primary-blue-light) 100%
        );
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .logo-img {
        width: 120px;
        height: auto;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        color: var(--text-dark);
      }

      .card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 82, 204, 0.1);
        padding: 32px;
        margin-bottom: 24px;
      }

      .patient-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 32px;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--border-light);
      }

      .info-field {
        display: flex;
        flex-direction: column;
      }

      .info-label {
        font-weight: 600;
        color: var(--text-muted);
        font-size: 12px;
        margin-bottom: 4px;
      }

      .info-value {
        color: var(--text-dark);
        font-weight: 500;
      }

      .records-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .record-item {
        border: 1px solid var(--border-light);
        border-radius: 12px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .record-item:hover {
        box-shadow: 0 4px 16px rgba(0, 82, 204, 0.1);
        border-color: var(--primary-blue);
      }

      .record-date {
        font-weight: 700;
        color: var(--primary-blue);
        font-size: 12px;
        margin-bottom: 8px;
      }

      .record-reason {
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 8px;
      }

      .record-diagnosis {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 8px;
      }

      .record-doctor {
        font-size: 12px;
        color: var(--text-muted);
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }

      .modal.show {
        display: flex;
      }

      .modal-content {
        background: white;
        border-radius: 16px;
        padding: 32px;
        max-width: 600px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-light);
      }

      .modal-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-dark);
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: var(--text-muted);
      }

      .modal-section {
        margin-bottom: 24px;
      }

      .modal-section-title {
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 12px;
        font-size: 14px;
      }

      .modal-section-content {
        background: var(--bg-secondary);
        padding: 16px;
        border-radius: 8px;
        color: var(--text-dark);
        line-height: 1.6;
      }

      .button {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s;
        font-family: var(--font-main);
      }

      .button-primary {
        background-color: var(--primary-blue);
        color: white;
      }

      .button-primary:hover {
        background-color: var(--primary-blue-dark);
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
      }

      .spinner {
        border: 3px solid var(--border-light);
        border-top: 3px solid var(--primary-blue);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        display: inline-block;
        margin-right: 8px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
      }

      .empty-state-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }

      .empty-state-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 8px;
      }
    </style>
      <link rel="stylesheet" href="../assets/identity.css" />
  </head>
  <body>
    <div class="patient-shell">
      <aside class="patient-sidebar">
        <a href="../../f.html" title="Tableau de bord"><i class="fa-solid fa-table-columns"></i></a>
        <a href="appointments.html" title="Prendre RDV"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="my-appointments.html" title="Mes RDV"><i class="fa-solid fa-clipboard-check"></i></a>
        <a class="active" href="medical-record.html" title="Dossier médical"><i class="fa-solid fa-notes-medical"></i></a>
        <a href="../../profile.html" title="Profil"><i class="fa-solid fa-circle-user"></i></a>
      </aside>
      <div class="container">
      <div class="header">
        <h1>📋 Dossier Médical</h1>
        <img src="../../image.png" alt="GeniDoc" class="logo-img" />
      </div>

      <div class="card" id="patientCard">
        <h2>Mes Informations</h2>
        <div class="patient-info" id="patientInfo">
          <div class="loading">
            <div class="spinner"></div>
            Chargement...
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Historique Médical</h2>
        <div class="records-list" id="recordsList">
          <div class="loading">
            <div class="spinner"></div>
            Chargement des dossiers...
          </div>
        </div>
      </div>
      </div>
    </div>

    <!-- Modal de détail -->
    <div class="modal" id="recordModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title">Détails de la visite</h3>
          <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">📅 Date de la visite</div>
          <div class="modal-section-content" id="modalDate"></div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">👨‍⚕️ Médecin</div>
          <div class="modal-section-content" id="modalDoctor"></div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">❓ Motif de la visite</div>
          <div class="modal-section-content" id="modalReason"></div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">🔍 Symptômes</div>
          <div class="modal-section-content" id="modalSymptoms"></div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">🩺 Diagnostic</div>
          <div class="modal-section-content" id="modalDiagnosis"></div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">💊 Traitement</div>
          <div class="modal-section-content" id="modalTreatment"></div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">📝 Médicaments</div>
          <div class="modal-section-content" id="modalMedications"></div>
        </div>

        <div style="text-align: right">
          <button class="button button-primary" onclick="closeModal()">
            Fermer
          </button>
        </div>
      </div>
    </div>

    <script src="../assets/api.js"></script>
    <script>
      let currentPatient = null;

      // Charger profil
      async function loadProfile() {
        try {
          const patient = await api.getProfile();
          if (patient.error) {
            showError("Erreur lors du chargement du profil");
            return;
          }

          currentPatient = patient;
          const infoDiv = document.getElementById("patientInfo");
          infoDiv.innerHTML = `
          <div class="info-field">
            <div class="info-label">NOM COMPLET</div>
            <div class="info-value">${patient.first_name} ${patient.last_name}</div>
          </div>
          <div class="info-field">
            <div class="info-label">EMAIL</div>
            <div class="info-value">${patient.email}</div>
          </div>
          <div class="info-field">
            <div class="info-label">TÉLÉPHONE</div>
            <div class="info-value">${patient.phone || "Non renseigné"}</div>
          </div>
          <div class="info-field">
            <div class="info-label">DATE DE NAISSANCE</div>
            <div class="info-value">${patient.date_of_birth ? new Date(patient.date_of_birth).toLocaleDateString("fr-FR") : "Non renseignée"}</div>
          </div>
          <div class="info-field">
            <div class="info-label">GROUPE SANGUIN</div>
            <div class="info-value">${patient.blood_type || "Non renseigné"}</div>
          </div>
          <div class="info-field">
            <div class="info-label">ALLERGIES</div>
            <div class="info-value">${patient.allergies || "Aucune signalée"}</div>
          </div>
        `;
        } catch (error) {
          showError("Erreur connexion API");
        }
      }

      // Charger dossiers
      async function loadRecords() {
        try {
          const records = await api.getMyMedicalRecords();
          const list = document.getElementById("recordsList");

          if (records.error || records.length === 0) {
            list.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📋</div>
              <div class="empty-state-title">Aucun dossier médical</div>
              <p>Vous n'avez pas encore de dossier médical. Il apparaîtra ici après vos consultations.</p>
            </div>
          `;
            return;
          }

          list.innerHTML = records
            .map(
              (record) => `
          <div class="record-item" onclick="showRecordDetails(${record.id})">
            <div class="record-date">${new Date(record.visit_date).toLocaleDateString("fr-FR")}</div>
            <div class="record-reason">${record.reason_for_visit || "Consultation"}</div>
            <div class="record-diagnosis">🩺 ${record.diagnosis || "En attente..."}</div>
            <div class="record-doctor">👨‍⚕️ Dr. ${record.doctor_name} - ${record.specialty}</div>
          </div>
        `,
            )
            .join("");
        } catch (error) {
          showError("Erreur lors du chargement des dossiers");
        }
      }

      // Afficher détails
      async function showRecordDetails(recordId) {
        try {
          const record = await api.getMedicalRecordById(recordId);
          if (record.error) {
            showError("Erreur");
            return;
          }

          document.getElementById("modalDate").textContent = new Date(
            record.visit_date,
          ).toLocaleDateString("fr-FR");
          document.getElementById("modalDoctor").textContent =
            `Dr. ${record.doctor_name} - ${record.specialty}`;
          document.getElementById("modalReason").textContent =
            record.reason_for_visit || "Non renseigné";
          document.getElementById("modalSymptoms").textContent =
            record.symptoms || "Non renseignés";
          document.getElementById("modalDiagnosis").textContent =
            record.diagnosis || "En attente";
          document.getElementById("modalTreatment").textContent =
            record.treatment || "Non renseigné";
          document.getElementById("modalMedications").textContent =
            record.medications || "Aucun";

          document.getElementById("recordModal").classList.add("show");
        } catch (error) {
          showError("Erreur");
        }
      }

      function closeModal() {
        document.getElementById("recordModal").classList.remove("show");
      }

      function showError(msg) {
        alert("❌ " + msg);
      }

      // Init
      window.addEventListener("DOMContentLoaded", () => {
        if (!api.getToken()) {
          window.location.href = "../auth.html";
          return;
        }
        loadProfile();
        loadRecords();
      });
    </script>
  </body>
</html>
