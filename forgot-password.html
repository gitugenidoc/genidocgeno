<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeniDoc - Récupération de mot de passe</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-blue: #0052cc;
        --primary-blue-dark: #003a99;
        --primary-blue-light: #e6f0ff;
        --bg-page: #e8eef2;
        --bg-card: #ffffff;
        --text-dark: #111827;
        --text-muted: #6b7280;
        --border-light: #e5e7eb;
        --font-main: "Plus Jakarta Sans", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-main);
        background:
          radial-gradient(circle at 10% 10%, #b3d9ff 0%, transparent 35%),
          radial-gradient(circle at 90% 90%, #c6dbea 0%, transparent 40%),
          var(--bg-page);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 480px;
        background-color: var(--bg-card);
        border-radius: 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 40px 32px;
        text-align: center;
      }

      .logo-img {
        height: 64px;
        width: auto;
        object-fit: contain;
        margin-bottom: 16px;
      }

      .header-text {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 500;
      }

      .content {
        padding: 0 40px 40px;
      }

      .content h1 {
        font-size: 28px;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 8px;
      }

      .content p {
        font-size: 14px;
        color: var(--text-muted);
        font-weight: 500;
        margin-bottom: 28px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
      }

      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .form-group input {
        padding: 12px 14px;
        border: 1.5px solid var(--border-light);
        border-radius: 12px;
        background: #fafbfc;
        font-family: inherit;
        font-size: 14px;
        color: var(--text-dark);
        outline: none;
        transition: all 0.2s;
      }

      .form-group input:focus {
        border-color: var(--primary-blue);
        background: white;
        box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.08);
      }

      .message {
        display: none;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 16px;
        font-weight: 500;
      }

      .message.show {
        display: block;
      }

      .success-message {
        background: #dbeafe;
        border: 1px solid #bfdbfe;
        color: #0c4a6e;
      }

      .submit-btn {
        width: 100%;
        padding: 13px 24px;
        background: linear-gradient(
          135deg,
          var(--primary-blue) 0%,
          var(--primary-blue-dark) 100%
        );
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(0, 82, 204, 0.25);
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0, 82, 204, 0.35);
      }

      .back-link {
        text-align: center;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border-light);
      }

      .back-link a {
        font-size: 13px;
        color: var(--primary-blue);
        text-decoration: none;
        font-weight: 600;
      }

      .back-link a:hover {
        text-decoration: underline;
      }

      .icon-wrapper {
        width: 64px;
        height: 64px;
        background: var(--primary-blue-light);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        font-size: 32px;
        color: var(--primary-blue);
      }
    </style>
      <link rel="stylesheet" href="frontend/assets/identity.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="image.png" alt="GeniDoc" class="logo-img" />
        <p class="header-text">Gestion Pédiatrique Intelligente</p>
      </div>

      <div class="content">
        <div class="icon-wrapper">
          <i class="fas fa-shield-check"></i>
        </div>

        <h1>Récupérer le mot de passe</h1>
        <p>
          Entrez votre adresse email pour recevoir un lien de réinitialisation
        </p>

        <div class="success-message message" id="successMsg"></div>

        <form onsubmit="handleReset(event)">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="vous@exemple.com"
              required
            />
          </div>

          <button type="submit" class="submit-btn">Envoyer le lien</button>
        </form>

        <div class="back-link">
          <a href="auth.html"
            ><i class="fas fa-arrow-left"></i> Retour à la connexion</a
          >
        </div>
      </div>
    </div>

    <script>
      function handleReset(e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const successMsg = document.getElementById("successMsg");

        if (!email) return;

        successMsg.textContent =
          "Un lien de réinitialisation a été envoyé à " + email;
        successMsg.classList.add("show");

        setTimeout(() => {
          window.location.href = "auth.html";
        }, 3000);
      }
    </script>
  </body>
</html>
