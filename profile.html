<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeniDoc - Profil patient</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="frontend/assets/identity.css" />
    <style>
      :root {
        --font-main: "Plus Jakarta Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: var(--font-main);
        padding: 24px;
      }

      .app-container {
        width: min(1180px, 100%);
        min-height: calc(100vh - 48px);
        margin: 0 auto;
        background: var(--bg-app);
        border-radius: 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.72);
        padding: 30px 40px;
        display: flex;
        flex-direction: column;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        margin-bottom: 28px;
      }

      .logo-img {
        height: 72px !important;
        width: auto;
        object-fit: contain;
      }

      .main-layout {
        display: flex;
        gap: 30px;
        flex: 1;
      }

      .sidebar {
        width: 70px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        flex-shrink: 0;
      }

      .sidebar a,
      .sidebar button {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: none;
        background: white;
        color: #9aa3af;
        font-size: 21px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
      }

      .sidebar .active {
        color: var(--brand-blue);
        border: 2px solid rgba(0, 82, 204, 0.18);
        box-shadow: 0 14px 28px rgba(0, 82, 204, 0.18);
      }

      .content-area {
        flex: 1;
        min-width: 0;
      }

      .content-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 24px;
      }

      .header-title p {
        color: var(--text-muted);
        font-weight: 600;
        margin-bottom: 4px;
      }

      .header-title h1 {
        font-size: 44px;
        line-height: 1.05;
        letter-spacing: 0;
        color: var(--text-dark);
      }

      .profile-grid {
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        gap: 24px;
      }

      .card {
        background: white;
        border-radius: 24px;
        border: 1px solid rgba(229, 231, 235, 0.8);
        padding: 24px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
      }

      .identity-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
      }

      .avatar {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: #e6f0ff;
        color: var(--brand-blue);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
      }

      .identity-card h2 {
        color: var(--text-dark);
        font-size: 22px;
      }

      .identity-card p,
      .muted {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .meta-list {
        width: 100%;
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--border-light);
        font-size: 14px;
      }

      .meta-row span:first-child {
        color: var(--text-muted);
        font-weight: 700;
      }

      .meta-row span:last-child {
        color: var(--text-dark);
        font-weight: 800;
        text-align: right;
      }

      .section-title {
        color: var(--text-dark);
        font-size: 18px;
        margin-bottom: 18px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .form-group.full {
        grid-column: 1 / -1;
      }

      label {
        display: block;
        color: var(--text-dark);
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 7px;
      }

      input,
      select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--border-light);
        background: #fff;
        color: var(--text-dark);
        padding: 0 14px;
        font: inherit;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 22px;
      }

      .btn {
        min-height: 46px;
        padding: 0 18px;
        border: 0;
        font-weight: 800;
        cursor: pointer;
      }

      .btn-primary {
        flex: 1;
      }

      .btn-secondary {
        background: white;
        color: var(--text-dark);
        border: 1px solid var(--border-light);
      }

      .message {
        display: none;
        padding: 12px 14px;
        border-radius: 16px;
        margin-bottom: 16px;
        font-size: 13px;
        font-weight: 800;
      }

      .message.show {
        display: block;
      }

      .success {
        background: #ecfdf5;
        color: #15803d;
      }

      .error {
        background: #fef2f2;
        color: #991b1b;
      }

      @media (max-width: 900px) {
        .main-layout,
        .top-row,
        .content-header {
          flex-direction: column;
          align-items: stretch;
        }

        .sidebar {
          width: 100%;
          flex-direction: row;
          overflow-x: auto;
        }

        .profile-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 620px) {
        body {
          padding: 0;
        }

        .app-container {
          border-radius: 0;
          min-height: 100vh;
          padding: 20px;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .content-header h1 {
          font-size: 34px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="top-row">
        <img src="image.png" alt="GeniDoc" class="logo-img" />
        <button class="btn btn-secondary" type="button" onclick="handleLogout()">
          <i class="fas fa-arrow-right-from-bracket"></i>
          Déconnexion
        </button>
      </div>

      <div class="main-layout">
        <aside class="sidebar">
          <a href="f.html" title="Tableau de bord"><i class="fa-solid fa-table-columns"></i></a>
          <a href="frontend/pages/appointments.html" title="Prendre RDV"><i class="fa-solid fa-calendar-days"></i></a>
          <a href="frontend/pages/my-appointments.html" title="Mes RDV"><i class="fa-solid fa-clipboard-check"></i></a>
          <a href="frontend/pages/medical-record.html" title="Dossier médical"><i class="fa-solid fa-notes-medical"></i></a>
          <a class="active" href="profile.html" title="Profil"><i class="fa-solid fa-circle-user"></i></a>
        </aside>

        <main class="content-area">
          <div class="content-header">
            <div class="header-title">
              <p>Vos informations patient</p>
              <h1>Profil</h1>
            </div>
          </div>

          <div class="profile-grid">
            <section class="card identity-card">
              <div class="avatar"><i class="fa-solid fa-user"></i></div>
              <h2 id="displayName">Chargement...</h2>
              <p id="displayEmail">Compte patient</p>
              <div class="meta-list">
                <div class="meta-row"><span>Téléphone</span><span id="displayPhone">-</span></div>
                <div class="meta-row"><span>Naissance</span><span id="displayBirth">-</span></div>
                <div class="meta-row"><span>Groupe sanguin</span><span id="displayBlood">-</span></div>
              </div>
            </section>

            <section class="card">
              <div class="message" id="messageBox"></div>
              <h2 class="section-title">Modifier mes informations</h2>
              <form onsubmit="handleSave(event)">
                <div class="form-grid">
                  <div class="form-group">
                    <label for="firstName">Prénom</label>
                    <input id="firstName" type="text" required />
                  </div>
                  <div class="form-group">
                    <label for="lastName">Nom</label>
                    <input id="lastName" type="text" required />
                  </div>
                  <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" disabled />
                  </div>
                  <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input id="phone" type="tel" />
                  </div>
                  <div class="form-group">
                    <label for="birthDate">Date de naissance</label>
                    <input id="birthDate" type="date" />
                  </div>
                  <div class="form-group">
                    <label for="bloodType">Groupe sanguin</label>
                    <select id="bloodType">
                      <option value="">Non renseigné</option>
                      <option value="A+">A+</option>
                      <option value="A-">A-</option>
                      <option value="B+">B+</option>
                      <option value="B-">B-</option>
                      <option value="AB+">AB+</option>
                      <option value="AB-">AB-</option>
                      <option value="O+">O+</option>
                      <option value="O-">O-</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="allergies">Allergies</label>
                    <input id="allergies" type="text" placeholder="Aucune signalée" />
                  </div>
                  <div class="form-group">
                    <label for="chronicDiseases">Maladies chroniques</label>
                    <input id="chronicDiseases" type="text" placeholder="Aucune" />
                  </div>
                  <div class="form-group">
                    <label for="emergencyName">Contact urgence</label>
                    <input id="emergencyName" type="text" />
                  </div>
                  <div class="form-group">
                    <label for="emergencyPhone">Téléphone urgence</label>
                    <input id="emergencyPhone" type="tel" />
                  </div>
                </div>
                <div class="actions">
                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    Enregistrer
                  </button>
                  <button type="button" class="btn btn-secondary" onclick="loadProfile()">
                    Annuler
                  </button>
                </div>
              </form>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:5000/api";
      const token = localStorage.getItem("token");
      let currentPatient = null;

      function formatDate(value) {
        if (!value) return "Non renseignée";
        return new Date(value).toLocaleDateString("fr-FR");
      }

      async function request(path, options = {}) {
        const response = await fetch(`${API_BASE}${path}`, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
            ...(options.headers || {}),
          },
        });
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || "Erreur API");
        return data;
      }

      function showMessage(type, text) {
        const box = document.getElementById("messageBox");
        box.textContent = text;
        box.className = `message show ${type}`;
        setTimeout(() => box.classList.remove("show"), 3500);
      }

      function renderProfile(patient) {
        currentPatient = patient;
        const fullName = [patient.first_name, patient.last_name].filter(Boolean).join(" ");
        document.getElementById("displayName").textContent = fullName || "Patient";
        document.getElementById("displayEmail").textContent = patient.email || "Compte patient";
        document.getElementById("displayPhone").textContent = patient.phone || "Non renseigné";
        document.getElementById("displayBirth").textContent = formatDate(patient.date_of_birth);
        document.getElementById("displayBlood").textContent = patient.blood_type || "Non renseigné";

        document.getElementById("firstName").value = patient.first_name || "";
        document.getElementById("lastName").value = patient.last_name || "";
        document.getElementById("email").value = patient.email || "";
        document.getElementById("phone").value = patient.phone || "";
        document.getElementById("birthDate").value = patient.date_of_birth
          ? patient.date_of_birth.slice(0, 10)
          : "";
        document.getElementById("bloodType").value = patient.blood_type || "";
        document.getElementById("allergies").value = patient.allergies || "";
        document.getElementById("chronicDiseases").value = patient.chronic_diseases || "";
        document.getElementById("emergencyName").value = patient.emergency_contact_name || "";
        document.getElementById("emergencyPhone").value = patient.emergency_contact_phone || "";
      }

      async function loadProfile() {
        if (!token) {
          window.location.href = "auth.html";
          return;
        }

        try {
          renderProfile(await request("/patients/profile"));
        } catch (error) {
          showMessage("error", "Impossible de charger le profil.");
        }
      }

      async function handleSave(event) {
        event.preventDefault();
        try {
          const result = await request("/patients/profile", {
            method: "PUT",
            body: JSON.stringify({
              first_name: document.getElementById("firstName").value,
              last_name: document.getElementById("lastName").value,
              phone: document.getElementById("phone").value,
              date_of_birth: document.getElementById("birthDate").value,
              blood_type: document.getElementById("bloodType").value,
              allergies: document.getElementById("allergies").value,
              chronic_diseases: document.getElementById("chronicDiseases").value,
              emergency_contact_name: document.getElementById("emergencyName").value,
              emergency_contact_phone: document.getElementById("emergencyPhone").value,
            }),
          });
          renderProfile(result.patient);
          localStorage.setItem(
            "user",
            JSON.stringify({
              id: result.patient.id,
              email: result.patient.email,
              first_name: result.patient.first_name,
              last_name: result.patient.last_name,
            }),
          );
          showMessage("success", "Profil mis à jour.");
        } catch (error) {
          showMessage("error", "Impossible de mettre à jour le profil.");
        }
      }

      function handleLogout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "auth.html";
      }

      loadProfile();
    </script>
  </body>
</html>
