<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nouveau mot de passe - GeniDoc Hayat</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/app/css/dashboard.css" />
  </head>
  <body>
    <main class="shell" style="max-width:620px;height:auto;margin:auto">
      <header class="topbar">
        <a class="brand" href="/app/auth/login.html">
          <img src="/image.png" alt="GeniDoc Hayat" />
          <span><strong>GeniDoc Hayat</strong><small>Nouveau mot de passe</small></span>
        </a>
      </header>
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Définir un nouveau mot de passe</h2>
            <p>Minimum 12 caractères.</p>
          </div>
        </div>
        <div class="message" id="message"></div>
        <form id="resetForm" class="form-grid">
          <div class="field full"><label>Nouveau mot de passe</label><input id="password" type="password" minlength="12" required /></div>
          <div class="field full"><button class="primary" type="submit">Mettre à jour</button></div>
        </form>
      </section>
    </main>
    <script src="/app/js/session.js"></script>
    <script>
      document.getElementById("resetForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const box = document.getElementById("message");
        try {
          const token = new URLSearchParams(window.location.search).get("token");
          const result = await apiRequest("/auth/reset-password", {
            method: "POST",
            body: JSON.stringify({ token, password: document.getElementById("password").value }),
          });
          box.textContent = result.message;
          box.className = "message show success";
        } catch (error) {
          box.textContent = error.message;
          box.className = "message show error";
        }
      });
    </script>
  </body>
</html>
