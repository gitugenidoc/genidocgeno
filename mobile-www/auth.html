<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeniDoc - Authentification</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-blue: #0052cc;
        --primary-blue-dark: #003a99;
        --primary-blue-light: #e6f0ff;
        --bg-page: #e8eef2;
        --bg-card: #ffffff;
        --text-dark: #111827;
        --text-muted: #6b7280;
        --border-light: #e5e7eb;
        --font-main: "Plus Jakarta Sans", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-main);
        background:
          radial-gradient(circle at 10% 10%, #b3d9ff 0%, transparent 35%),
          radial-gradient(circle at 90% 90%, #c6dbea 0%, transparent 40%),
          var(--bg-page);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 480px;
        background-color: var(--bg-card);
        border-radius: 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 40px 32px;
        text-align: center;
      }

      .logo-img {
        height: 80px;
        width: auto;
        object-fit: contain;
        margin-bottom: 16px;
      }

      .header-text {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 500;
      }

      .description {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.6;
        margin-top: 8px;
        font-weight: 400;
      }

      .roles-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
        font-size: 12px;
      }

      .role-item {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-muted);
      }

      .role-item i {
        color: var(--primary-blue);
        font-size: 14px;
      }

      .tabs-container {
        display: flex;
        border-bottom: 1px solid var(--border-light);
      }

      .tab {
        flex: 1;
        padding: 18px;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        color: var(--text-muted);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        background: white;
        position: relative;
      }

      .tab::after {
        content: "";
        position: absolute;
        bottom: -3px;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--primary-blue),
          transparent
        );
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }

      .tab.active {
        color: var(--primary-blue);
        border-bottom-color: var(--primary-blue);
      }

      .tab.active::after {
        opacity: 1;
      }

      .tab:hover {
        background: var(--primary-blue-light);
        transform: translateY(-1px);
      }

      .content {
        padding: 40px;
        display: none;
        animation: slideInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .content.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 4px 12px rgba(0, 82, 204, 0.25);
        }
        50% {
          box-shadow: 0 8px 24px rgba(0, 82, 204, 0.4);
        }
      }

      @keyframes ripple {
        0% {
          transform: scale(0);
          opacity: 0.6;
        }
        100% {
          transform: scale(4);
          opacity: 0;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -1000px 0;
        }
        100% {
          background-position: 1000px 0;
        }
      }

      .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
        animation: slideInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        opacity: 0;
      }

      #login .form-group:nth-child(1) {
        animation-delay: 0.1s;
      }

      #login .form-group:nth-child(2) {
        animation-delay: 0.2s;
      }

      #login .checkbox-group {
        animation: slideInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s
          forwards;
        opacity: 0;
      }

      #signup .form-group:nth-child(1) {
        animation-delay: 0.1s;
      }

      #signup .form-group:nth-child(2) {
        animation-delay: 0.2s;
      }

      #signup .form-group:nth-child(3) {
        animation-delay: 0.3s;
      }

      #signup .form-row {
        animation: slideInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s
          forwards;
        opacity: 0;
      }

      #signup .checkbox-group {
        animation: slideInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s
          forwards;
        opacity: 0;
      }

      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .form-group input,
      .form-group select {
        padding: 12px 14px;
        border: 1.5px solid var(--border-light);
        border-radius: 12px;
        background: #fafbfc;
        font-family: inherit;
        font-size: 14px;
        color: var(--text-dark);
        outline: none;
        transition: all 0.2s;
      }

      .form-group input::placeholder {
        color: var(--text-muted);
      }

      .form-group input:focus,
      .form-group select:focus {
        border-color: var(--primary-blue);
        background: white;
        box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.08);
        transform: translateY(-2px);
        animation: glow 0.6s ease-in-out infinite;
      }

      .input-wrapper {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 14px;
        padding: 4px 8px;
        transition: all 0.2s;
      }

      .password-toggle:hover {
        color: var(--primary-blue);
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }

      .checkbox-group input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--primary-blue);
      }

      .checkbox-group label {
        font-size: 13px;
        color: var(--text-muted);
        cursor: pointer;
        margin: 0;
        font-weight: 500;
      }

      .forgot-link {
        text-align: right;
        margin-bottom: 24px;
      }

      .forgot-link a {
        font-size: 12px;
        color: var(--primary-blue);
        text-decoration: none;
        font-weight: 600;
      }

      .forgot-link a:hover {
        text-decoration: underline;
      }

      .submit-btn {
        width: 100%;
        padding: 13px 24px;
        background: linear-gradient(
          135deg,
          var(--primary-blue) 0%,
          var(--primary-blue-dark) 100%
        );
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 4px 12px rgba(0, 82, 204, 0.25);
        position: relative;
        overflow: hidden;
      }

      .submit-btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 82, 204, 0.35);
        animation: float 2s ease-in-out infinite;
      }

      .submit-btn:active {
        transform: translateY(0) scale(0.98);
      }

      .submit-btn:active::before {
        animation: ripple 0.6s ease-out;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0;
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 600;
        animation: slideInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s
          forwards;
        opacity: 0;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-light);
      }

      .social-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        animation: slideInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s
          forwards;
        opacity: 0;
      }

      .doctor-access {
        margin-top: 18px;
        display: flex;
        justify-content: center;
      }

      .doctor-access a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 18px;
        border-radius: 999px;
        border: 1px solid var(--border-light);
        background: white;
        color: var(--primary-blue);
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 8px 20px rgba(0, 82, 204, 0.08);
      }

      .social-btn {
        padding: 11px 14px;
        background: #fafbfc;
        border: 1.5px solid var(--border-light);
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dark);
        cursor: pointer;
        font-family: inherit;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        position: relative;
        overflow: hidden;
      }

      .social-btn::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(0, 82, 204, 0.1);
        transform: translate(-50%, -50%);
      }

      .social-btn:hover {
        border-color: var(--primary-blue);
        background: white;
        box-shadow: 0 2px 8px rgba(0, 82, 204, 0.12);
        transform: translateY(-2px) scale(1.02);
      }

      .social-btn:active {
        transform: translateY(0) scale(0.98);
      }

      .social-btn i {
        font-size: 14px;
        transition: all 0.3s ease-out;
      }

      .social-btn:hover i {
        transform: scale(1.2) rotate(5deg);
      }

      .footer {
        text-align: center;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border-light);
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 500;
      }

      .footer a {
        color: var(--primary-blue);
        text-decoration: none;
        font-weight: 700;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      .message {
        display: none;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 16px;
        font-weight: 500;
      }

      .message.show {
        display: block;
      }

      .error-message {
        background: #fee2e2;
        border: 1px solid #fecaca;
        color: #991b1b;
      }

      .success-message {
        background: #dcfce7;
        border: 1px solid #bbf7d0;
        color: #166534;
      }
    </style>
      <link rel="stylesheet" href="frontend/assets/identity.css" />
      <script src="/mobile-config.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#123b64" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GeniDoc Hayat" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="image.png" alt="GeniDoc" class="logo-img" />
        <p class="header-text">Connexion</p>
        <p class="description">Accès sécurisé aux espaces école, parent, pédiatre et administration.</p>
        
        <div class="roles-grid">
          <div class="role-item">
            <i class="fas fa-book"></i>
            <span>École</span>
          </div>
          <div class="role-item">
            <i class="fas fa-home"></i>
            <span>Parent</span>
          </div>
          <div class="role-item">
            <i class="fas fa-stethoscope"></i>
            <span>Pédiatre</span>
          </div>
          <div class="role-item">
            <i class="fas fa-shield-alt"></i>
            <span>Administration</span>
          </div>
        </div>
      </div>

      <div class="tabs-container">
        <div class="tab active" data-tab="login" onclick="switchTab('login')">
          Connexion
        </div>
        <div class="tab" data-tab="signup" onclick="switchTab('signup')">
          S'inscrire
        </div>
      </div>

      <!-- Login Form -->
      <div id="login" class="content active">
        <div class="message" id="loginError"></div>

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input
              type="email"
              id="loginEmail"
              placeholder="vous@exemple.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="loginPassword">Mot de passe</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="loginPassword"
                placeholder="••••••••"
                required
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('loginPassword')"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="rememberMe" />
            <label for="rememberMe">Se souvenir de moi</label>
          </div>

          <div class="forgot-link">
            <a href="forgot-password.html">Mot de passe oublié?</a>
          </div>

          <button type="submit" class="submit-btn">Se connecter</button>
        </form>

        <div class="divider">ou</div>

        <div class="social-buttons">
          <button
            type="button"
            class="social-btn"
            onclick="handleSocialLogin('google')"
          >
            <i class="fab fa-google"></i>
            Google
          </button>
          <button
            type="button"
            class="social-btn"
            onclick="handleSocialLogin('microsoft')"
          >
            <i class="fab fa-microsoft"></i>
            Microsoft
          </button>
        </div>

        <div class="doctor-access">
          <a href="doctor-auth.html">
            <i class="fas fa-stethoscope"></i>
            Accès médecin
          </a>
        </div>

        <div class="footer">
          Pas encore inscrit?
          <a
            href="#"
            onclick="
              switchTab('signup');
              return false;
            "
            >S'inscrire</a
          >
        </div>
      </div>

      <!-- Signup Form -->
      <div id="signup" class="content">
        <div class="message" id="signupError"></div>

        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label for="fullname">Nom complet</label>
            <input
              type="text"
              id="fullname"
              placeholder="Marie Dupont"
              required
            />
          </div>

          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input
              type="email"
              id="signupEmail"
              placeholder="vous@exemple.com"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="signupPassword">Mot de passe</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="signupPassword"
                  placeholder="••••••••"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('signupPassword')"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="confirmPassword">Confirmer</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="confirmPassword"
                  placeholder="••••••••"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('confirmPassword')"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="terms" required />
            <label for="terms">J'accepte les conditions d'utilisation</label>
          </div>

          <button type="submit" class="submit-btn">S'inscrire</button>
        </form>

        <div class="footer">
          Déjà inscrit?
          <a
            href="#"
            onclick="
              switchTab('login');
              return false;
            "
            >Se connecter</a
          >
        </div>
      </div>
    </div>

    <script>
      function switchTab(tabName) {
        // Hide all content
        document
          .querySelectorAll(".content")
          .forEach((el) => el.classList.remove("active"));
        document
          .querySelectorAll(".tab")
          .forEach((el) => el.classList.remove("active"));

        // Show selected content
        document.getElementById(tabName).classList.add("active");
        document
          .querySelector(`[data-tab="${tabName}"]`)
          .classList.add("active");
      }

      function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const type = input.type === "password" ? "text" : "password";
        input.type = type;
      }

      async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;
        const errorDiv = document.getElementById("loginError");

        if (!email || !password) {
          errorDiv.textContent = "Email et mot de passe requis";
          errorDiv.classList.add("show", "error-message");
          return;
        }

        try {
          const response = await fetch(
            "http://localhost:5000/api/patients/login",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            },
          );

          const data = await response.json();

          if (data.error) {
            errorDiv.textContent = data.error;
            errorDiv.classList.add("show", "error-message");
            return;
          }

          // Sauvegarder le token
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.patient));

          errorDiv.classList.remove("show");
          setTimeout(() => {
            window.location.href = "f.html";
          }, 300);
        } catch (error) {
          errorDiv.textContent = "Erreur connexion serveur";
          errorDiv.classList.add("show", "error-message");
        }
      }

      async function handleSignup(e) {
        e.preventDefault();
        const email = document.getElementById("signupEmail").value;
        const fullname = document.getElementById("fullname").value.trim();
        const password = document.getElementById("signupPassword").value;
        const confirm = document.getElementById("confirmPassword").value;
        const errorDiv = document.getElementById("signupError");

        if (!fullname || !email || !password || !confirm) {
          errorDiv.textContent = "Tous les champs sont requis";
          errorDiv.classList.add("show", "error-message");
          return;
        }

        if (password !== confirm) {
          errorDiv.textContent = "Les mots de passe ne correspondent pas";
          errorDiv.classList.add("show", "error-message");
          return;
        }

        if (password.length < 8) {
          errorDiv.textContent =
            "Le mot de passe doit contenir au moins 8 caractères";
          errorDiv.classList.add("show", "error-message");
          return;
        }

        const nameParts = fullname.split(/\s+/);
        const first_name = nameParts.shift();
        const last_name = nameParts.join(" ") || first_name;

        try {
          const response = await fetch(
            "http://localhost:5000/api/patients/register",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email,
                password,
                first_name,
                last_name,
              }),
            },
          );

          const data = await response.json();

          if (data.error) {
            errorDiv.textContent = data.error;
            errorDiv.classList.add("show", "error-message");
            return;
          }

          // Sauvegarder le token
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.patient));

          errorDiv.classList.remove("show");
          setTimeout(() => {
            window.location.href = "onboarding.html";
          }, 300);
        } catch (error) {
          errorDiv.textContent = "Erreur connexion serveur";
          errorDiv.classList.add("show", "error-message");
        }
      }

      function handleSocialLogin(provider) {
        console.log("Social login:", provider);
      }

      // Initialize tab listeners
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", function () {
          switchTab(this.dataset.tab);
        });
      });
    </script>
  </body>
</html>
