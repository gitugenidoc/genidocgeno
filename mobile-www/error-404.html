<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeniDoc - Page non trouvée</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-blue: #0052cc;
        --primary-blue-dark: #003a99;
        --primary-blue-light: #e6f0ff;
        --bg-page: #f3f4f6;
        --bg-card: #ffffff;
        --text-dark: #111827;
        --text-muted: #6b7280;
        --border-light: #e5e7eb;
        --font-main: "Plus Jakarta Sans", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-main);
        background:
          radial-gradient(circle at 10% 10%, #b3d9ff 0%, transparent 35%),
          radial-gradient(circle at 90% 90%, #c6dbea 0%, transparent 40%),
          var(--bg-page);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .container {
        max-width: 600px;
        text-align: center;
      }

      .error-icon {
        font-size: 120px;
        color: var(--primary-blue);
        margin-bottom: 24px;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .logo-img {
        height: 48px;
        width: auto;
        margin-bottom: 16px;
        opacity: 0.8;
      }

      h1 {
        font-size: 48px;
        font-weight: 800;
        color: var(--text-dark);
        margin: 24px 0 12px;
        background: linear-gradient(
          135deg,
          var(--primary-blue) 0%,
          var(--primary-blue-dark) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      h2 {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 12px;
      }

      p {
        font-size: 16px;
        color: var(--text-muted);
        font-weight: 500;
        margin-bottom: 8px;
        line-height: 1.6;
      }

      .description {
        margin-bottom: 32px;
      }

      .buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 13px 24px;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-block;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--primary-blue) 0%,
          var(--primary-blue-dark) 100%
        );
        color: white;
        box-shadow: 0 4px 12px rgba(0, 82, 204, 0.25);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0, 82, 204, 0.35);
      }

      .btn-secondary {
        background: var(--border-light);
        color: var(--text-dark);
        border: 1px solid #d1d5db;
      }

      .btn-secondary:hover {
        background: #e5e7eb;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
        margin-top: 48px;
        padding-top: 48px;
        border-top: 1px solid var(--border-light);
      }

      .feature-item {
        padding: 20px;
        background: white;
        border-radius: 12px;
        border: 1px solid var(--border-light);
      }

      .feature-icon {
        font-size: 28px;
        color: var(--primary-blue);
        margin-bottom: 8px;
      }

      .feature-text {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 600;
      }
    </style>
      <link rel="stylesheet" href="frontend/assets/identity.css" />
      <script src="/mobile-config.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#123b64" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GeniDoc Hayat" />
  </head>
  <body>
    <div class="container">
      <div class="error-icon">
        <i class="fas fa-triangle-exclamation"></i>
      </div>

      <img src="image.png" alt="GeniDoc" class="logo-img" />

      <h1>404</h1>
      <h2>Oups! Page non trouvée</h2>

      <div class="description">
        <p>
          Désolé, la page que vous recherchez n'existe pas ou a été supprimée.
        </p>
        <p>Veuillez vérifier l'adresse URL ou retourner à la page d'accueil.</p>
      </div>

      <div class="buttons">
        <button
          class="btn btn-primary"
          onclick="window.location.href = 'f.html'"
        >
          <i class="fas fa-home"></i> Aller à l'accueil
        </button>
        <button class="btn btn-secondary" onclick="window.history.back()">
          <i class="fas fa-arrow-left"></i> Retour
        </button>
      </div>

      <div class="features">
        <div class="feature-item">
          <div class="feature-icon">
            <i class="fas fa-tasks"></i>
          </div>
          <div class="feature-text">Patients</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">
            <i class="fas fa-heartbeat"></i>
          </div>
          <div class="feature-text">Consultations</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">
            <i class="fas fa-prescription-bottle"></i>
          </div>
          <div class="feature-text">Prescriptions</div>
        </div>
      </div>
    </div>
  </body>
</html>
